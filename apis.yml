name: Yacob
description: Yacob was a Dubai-based Intelligent Nutrition platform and 500 Global
  portfolio company that combined cashless school-meal payments with nutrition monitoring.
  Pupils paid for school meals with a stored-value card while parents topped up accounts
  online, tracked transactions in real time, set spend and food limits, flagged allergies,
  and reviewed the nutritional value of their children's meals. The company appears
  dormant, with yacob.com no longer resolving as of 2026, and no public API surface
  was ever found.
